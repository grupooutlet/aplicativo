/* Management header, understated credit, and product choices. */
.topbar .top-actions{flex:1;min-width:0;justify-content:flex-end}
.topbar .global-search{display:flex;margin-right:auto;width:min(460px,100%);min-height:42px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#f8f8f7;text-align:left;color:#7b8388;font-size:13px}
.topbar .global-search:hover,.topbar .global-search:focus-visible{border-color:#c9b858;background:#fff}
.topbar .global-search span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .global-search .icon{width:18px;height:18px}
.footer>span:first-child{display:inline-flex;align-items:center;gap:5px}
.variation-editor{border:1px solid var(--line);border-radius:9px;padding:17px;background:#fafaf9}
.variation-editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.variation-editor-head strong{font-size:14px}
.variation-editor-head small{display:block;margin-top:4px;line-height:1.5}
.variation-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto;align-items:end;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.variation-row .btn{margin-bottom:1px}
.product-options{display:grid;gap:13px;margin:24px 0}
.product-options .field{max-width:420px}
.cart-options{display:block;color:#73797e;font-size:12px;line-height:1.5;margin:0 0 5px}
.cart-options:empty{display:none}
#admin-variation-fields:not([hidden]){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
@media(max-width:650px){
  .topbar{gap:10px}
  .topbar .top-actions{gap:8px}
  .topbar .global-search{flex:1;min-width:0;width:auto;margin:0;padding:8px 10px;font-size:11px}
  .topbar .global-search .icon{width:17px;height:17px}
  .variation-editor-head{align-items:flex-start;flex-direction:column}
  .variation-row{grid-template-columns:1fr}
  .variation-row .btn{justify-self:start}
  #admin-variation-fields:not([hidden]){grid-template-columns:1fr}
  .footer{flex-wrap:wrap}
}
/* Restricted delivery workspace */
.driver-app{min-height:100vh;background:#f6f5f1;color:#18232d}
.driver-header{display:flex;align-items:center;gap:16px;padding:16px max(24px,calc((100vw - 1180px)/2));background:#fff;border-bottom:1px solid #e5e4df}
.driver-header img{width:140px;max-height:52px;object-fit:contain;object-position:left}
.driver-header div{display:flex;flex-direction:column;gap:3px;min-width:0}
.driver-header small{color:#68717a}
.driver-header .btn{margin-left:auto}
.driver-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.driver-title h1{margin-bottom:5px}
.driver-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.driver-card{align-self:start}
.driver-card>p{line-height:1.55;margin:8px 0}
@media(max-width:640px){.driver-header{padding:14px 16px}.driver-header img{width:92px}.driver-title{align-items:flex-start}.driver-title .btn{white-space:nowrap}}

<body>
  <div id="app"><main class="boot-fallback" style="font:16px Arial,sans-serif;max-width:560px;margin:12vh auto;padding:25px;color:#1C2228"><h1>Forte Outlet</h1><p>Carregando loja e sistema...</p><p>Se esta mensagem continuar, tente atualizar a página e consulte o README.</p></main></div>
  <dialog id="modal"></dialog>
  <div id="toast" role="status"></div>
  <script>const storefront=(()=>{
  const labels={banner:'Banner',collection:'Coleção de produtos',image:'Imagem com texto',video:'Vídeo',text:'Texto',benefits:'Diferenciais da loja'};
  const defaultBenefits=[
    {icon:'truck',title:'Entrega com cuidado',body:'Consulte sua região'},
    {icon:'wallet',title:'Compra do seu jeito',body:'Combine o pagamento com a loja'},
    {icon:'shield',title:'Atendimento de verdade',body:'Nossa equipe cuida de você'},
    {icon:'store',title:'Sua loja de confiança',body:'Visite nossa loja física'}
  ];
  let selected='home-hero',previewSize='desktop';
  const home=()=>db.storefront;
  const section=()=>home().sections.find(s=>s.id===selected);
  const photo=(value)=>{const url=String(value||'').trim();return /^data:image\/(?:png|jpeg|webp);base64,[a-z0-9+/=]+$/i.test(url)||/^https?:\/\//i.test(url)?url:''};
  const shopLink=(value)=>{const url=String(value||'').trim();return /^\/loja(?:\/|$)/.test(url)||/^https:\/\//i.test(url)?url:'/loja/catalogo'};
  const cta=(s,preview)=>!s.buttonLabel?'':preview?`<span class="btn dark">${esc(s.buttonLabel)}</span>`:`<a class="btn dark" href="${esc(shopLink(s.buttonLink))}" ${/^https:\/\//i.test(s.buttonLink||'')?'target="_blank" rel="noopener"':''}>${esc(s.buttonLabel)}</a>`;
  const newId=()=>`sec-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,5)}`;
  function init(model){
    if(model.storefront?.sections?.length)return false;
    model.storefront={announcement:{enabled:true,text:'Uma casa cheia de possibilidades.',highlight:'Preços de outlet, todos os dias.'},sections:[
      {id:'home-hero',type:'banner',enabled:true,eyebrow:`Bem-vindo à ${model.settings.name}`,title:model.settings.hero,subtitle:model.settings.subtitle,image:seedProducts[0].image,imageAlt:'Sofá em uma sala de estar',buttonLabel:'Encontrar meu próximo móvel',buttonLink:'/loja/catalogo',align:'left'},
      {id:'home-benefits',type:'benefits',enabled:true,items:structuredClone(defaultBenefits)},
      {id:'home-products',type:'collection',enabled:true,eyebrow:'Escolhas para sua casa',title:'Seu novo favorito está aqui.',category:'Todos',limit:8}
    ]};
    return true;
  }
  function announcement(){const a=home().announcement;return a.enabled?`<div class="store-promo">${esc(a.text)} ${a.highlight?`<b>${esc(a.highlight)}</b>`:''}</div>`:''}
  function announcementControls(){const a=home().announcement;return `<section class="builder-card"><div class="builder-card-head"><div><span class="eyebrow">CABEÇALHO</span><h2>Faixa de aviso</h2></div><label class="builder-switch"><input type="checkbox" ${a.enabled?'checked':''} onchange="storefront.changeAnnouncement('enabled',this.checked)"><span>${a.enabled?'Visível':'Oculta'}</span></label></div><div class="builder-fields"><label class="field">Mensagem<input maxlength="110" value="${esc(a.text)}" oninput="storefront.changeAnnouncement('text',this.value)"></label><label class="field">Trecho em destaque<input maxlength="90" value="${esc(a.highlight)}" oninput="storefront.changeAnnouncement('highlight',this.value)"></label></div></section>`}
  function videoEmbed(raw){
    let url;try{url=new URL(String(raw||'').trim())}catch{return ''}
    if(!['https:','http:'].includes(url.protocol))return '';
    const host=url.hostname.toLowerCase().replace(/^www\./,'');let id='';
    if(host==='youtube.com'||host==='m.youtube.com'||host==='youtube-nocookie.com')id=url.searchParams.get('v')||url.pathname.match(/^\/(?:embed|shorts)\/([\w-]{11})/)?.[1]||'';
    if(host==='youtu.be')id=url.pathname.slice(1).split('/')[0];
    if(/^[\w-]{11}$/.test(id))return `<iframe src="https://www.youtube-nocookie.com/embed/${id}" title="Vídeo da loja" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    if(host==='vimeo.com'||host==='player.vimeo.com'){const videoId=url.pathname.match(/(?:video\/)?(\d+)/)?.[1];if(videoId)return `<iframe src="https://player.vimeo.com/video/${videoId}" title="Vídeo da loja" loading="lazy" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>`}
    if(/\.mp4(?:$|\?)/i.test(url.href))return `<video controls playsinline preload="metadata" src="${esc(url.href)}"></video>`;
    return '';
  }
  function renderSection(s,preview=false){
    if(!s.enabled)return '';
    if(s.type==='banner')return `<section class="store-hero storefront-banner ${s.align==='right'?'align-right':''}">${photo(s.image)?`<img class="hero-image" src="${esc(photo(s.image))}" alt="${esc(s.imageAlt||s.title||'Banner da loja')}" loading="lazy">`:''}<div class="hero-content">${s.eyebrow?`<span class="eyebrow">${esc(s.eyebrow)}</span>`:''}<h1>${esc(s.title||'Banner')}</h1>${s.subtitle?`<p>${esc(s.subtitle)}</p>`:''}${cta(s,preview)}</div></section>`;
    if(s.type==='benefits')return `<div class="store-benefits">${(s.items||[]).map(item=>`<div class="benefit">${icon(item.icon||'check')}<div><strong>${esc(item.title||'')}</strong><small>${esc(item.body||'')}</small></div></div>`).join('')}</div>`;
    if(s.type==='collection'){const category=s.category||'Todos';const products=db.products.filter(p=>p.active&&(category==='Todos'||p.category===category)).slice(0,Math.max(1,Math.min(24,Number(s.limit)||8)));return `<section class="storefront-collection"><div class="catalog-head"><div>${s.eyebrow?`<span class="eyebrow">${esc(s.eyebrow)}</span>`:''}<h2>${esc(s.title||category)}</h2></div>${preview?'<span class="text-link">Ver todos</span>':`<a class="text-link" href="/loja/catalogo" onclick="catalogCategory=decodeURIComponent('${encodeURIComponent(category).replace(/'/g,'%27')}')">Ver todos</a>`}</div><div class="catalog">${products.map(p=>preview?`<article class="shop-product"><div class="product-photo"><img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"></div><h3>${esc(p.name)}</h3>${priceMarkup(p)}</article>`:shopProduct(p)).join('')}</div>${products.length?'':`<p class="subtle">Nenhum produto ativo nesta coleção.</p>`}</section>`}
    if(s.type==='image')return `<section class="storefront-image ${s.layout==='image-right'?'image-right':''}"><div class="storefront-image-photo">${photo(s.image)?`<img src="${esc(photo(s.image))}" alt="${esc(s.imageAlt||s.title||'Imagem da loja')}" loading="lazy">`:'<span>Imagem ainda não adicionada</span>'}</div><div class="storefront-image-copy"><span class="eyebrow">${esc(s.eyebrow||'FORTE OUTLET')}</span><h2>${esc(s.title||'Sua casa merece esse cuidado.')}</h2><p>${esc(s.body||'')}</p>${cta(s,preview)}</div></section>`;
    if(s.type==='video')return `<section class="storefront-video"><div class="catalog-head"><div><span class="eyebrow">${esc(s.eyebrow||'INSPIRE-SE')}</span><h2>${esc(s.title||'Veja de perto')}</h2>${s.body?`<p>${esc(s.body)}</p>`:''}</div></div><div class="storefront-video-frame">${videoEmbed(s.url)||'<span>Adicione o link do vídeo para exibi-lo aqui.</span>'}</div></section>`;
    if(s.type==='text')return `<section class="storefront-text"><span class="eyebrow">${esc(s.eyebrow||'')}</span><h2>${esc(s.title||'Uma mensagem da loja')}</h2><p>${esc(s.body||'')}</p>${cta(s,preview)}</section>`;
    return '';

  function sectionRow(s,i){return `<div class="builder-section-row ${selected===s.id?'active':''} ${s.enabled?'':'is-hidden'}"><button class="builder-section-select" onclick="storefront.select('${s.id}')"><span class="builder-section-icon">${icon(({banner:'image',image:'image',video:'eye',collection:'layers',text:'page',benefits:'shield'})[s.type])}</span><span><strong>${esc(s.title||labels[s.type])}</strong><small>${labels[s.type]}${s.enabled?'':' · Oculta'}</small></span></button><div class="builder-section-actions"><button title="Subir" aria-label="Subir ${esc(labels[s.type])}" onclick="storefront.move('${s.id}',-1)" ${i===0?'disabled':''}>↑</button><button title="Descer" aria-label="Descer ${esc(labels[s.type])}" onclick="storefront.move('${s.id}',1)" ${i===home().sections.length-1?'disabled':''}>↓</button></div></div>`}
  const input=(label,key,value,type='text',extra='')=>`<label class="field">${label}<input name="${key}" type="${type}" value="${esc(value||'')}" ${extra} oninput="storefront.change('${key}',this.value)"></label>`;
  const textarea=(label,key,value)=>`<label class="field">${label}<textarea name="${key}" oninput="storefront.change('${key}',this.value)">${esc(value||'')}</textarea></label>`;
  const choose=(label,key,value,options)=>`<label class="field">${label}<select name="${key}" onchange="storefront.change('${key}',this.value)">${options.map(([v,text])=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(text)}</option>`).join('')}</select></label>`;
  const imageControls=(s,key='image')=>`${input('URL da imagem',key,s[key],'url','placeholder="https://..."')}<label class="field">Ou envie uma imagem<input type="file" accept="image/png,image/jpeg,image/webp" onchange="storefront.uploadImage(this,'${key}')"><small>JPG, PNG ou WebP · até 2 MB</small></label>${s[key]?`<div class="builder-image-preview"><img src="${esc(photo(s[key]))}" alt="Prévia da imagem"><button class="btn small" onclick="storefront.change('${key}','');storefront.render()">Remover imagem</button></div>`:''}`;
  function controls(s){
    if(s.type==='banner')return `${input('Texto pequeno acima do título','eyebrow',s.eyebrow)}${input('Título','title',s.title)}${textarea('Descrição','subtitle',s.subtitle)}${imageControls(s)}${input('Descrição da imagem','imageAlt',s.imageAlt)}${choose('Alinhamento do texto','align',s.align,[['left','À esquerda'],['right','À direita']])}${input('Texto do botão','buttonLabel',s.buttonLabel)}${input('Link do botão','buttonLink',s.buttonLink,'text','placeholder="/loja/catalogo"')}`;
    if(s.type==='collection')return `${input('Texto pequeno acima do título','eyebrow',s.eyebrow)}${input('Título','title',s.title)}${choose('Coleção','category',s.category,[['Todos','Todos os produtos'],...db.collections.map(c=>[c,c])])}${input('Número de produtos','limit',s.limit,'number','min="1" max="24"')}<button class="btn small" onclick="collectionModal()">Criar coleção</button>`;
    if(s.type==='image')return `${input('Texto pequeno acima do título','eyebrow',s.eyebrow)}${input('Título','title',s.title)}${textarea('Texto','body',s.body)}${imageControls(s)}${input('Descrição da imagem','imageAlt',s.imageAlt)}${choose('Posição da imagem','layout',s.layout,[['image-left','À esquerda'],['image-right','À direita']])}${input('Texto do botão','buttonLabel',s.buttonLabel)}${input('Link do botão','buttonLink',s.buttonLink,'text','placeholder="/loja/catalogo"')}`;
    if(s.type==='video')return `${input('Texto pequeno acima do título','eyebrow',s.eyebrow)}${input('Título','title',s.title)}${textarea('Texto','body',s.body)}${input('Link do vídeo','url',s.url,'url','placeholder="YouTube, Vimeo ou .mp4"')}<p class="builder-hint">Cole um link público do YouTube, Vimeo ou de um arquivo MP4. O vídeo não reproduz sozinho.</p>`;
    if(s.type==='text')return `${input('Texto pequeno acima do título','eyebrow',s.eyebrow)}${input('Título','title',s.title)}${textarea('Texto','body',s.body)}${input('Texto do botão','buttonLabel',s.buttonLabel)}${input('Link do botão','buttonLink',s.buttonLink)}`;
    if(s.type==='benefits')return (s.items||[]).map((item,i)=>`<div class="builder-benefit-fields"><h3>Diferencial ${i+1}</h3>${input('Título',`items.${i}.title`,item.title)}${input('Texto',`items.${i}.body`,item.body)}${choose('Ícone',`items.${i}.icon`,item.icon,[['truck','Entrega'],['wallet','Pagamento'],['shield','Confiança'],['store','Loja'],['check','Confirmação']])}</div>`).join('');
    return '';
  }
  function editorPage(){const s=section()||home().sections[0];selected=s.id;return heading('Loja online','Monte a página inicial e veja cada alteração na prévia.',button('Abrir loja','onclick="go(\'/loja\')"','','external'))+`<div class="storefront-builder"><div class="builder-column">${announcementControls()}<section class="builder-card"><div class="builder-card-head"><div><span class="eyebrow">PÁGINA INICIAL</span><h2>Seções da home</h2></div><span class="builder-count">${home().sections.length}</span></div><div class="builder-section-list">${home().sections.map(sectionRow).join('')}</div><button class="builder-add" onclick="storefront.addModal()">${icon('plus')} Adicionar seção</button><p class="builder-hint">Use as setas para mudar a ordem. Seções ocultas não aparecem na loja.</p></section><section class="builder-card"><div class="builder-card-head"><div><span class="eyebrow">EDITAR SEÇÃO</span><h2>${esc(labels[s.type])}</h2></div><label class="builder-switch"><input type="checkbox" ${s.enabled?'checked':''} onchange="storefront.toggle('${s.id}',this.checked)"><span>${s.enabled?'Visível':'Oculta'}</span></label></div><div class="builder-fields">${controls(s)}</div><div class="builder-card-foot"><button class="btn small" onclick="storefront.duplicate('${s.id}')">${icon('plus')} Duplicar</button><button class="btn small danger" onclick="storefront.removeModal('${s.id}')">${icon('trash')} Excluir</button></div></section></div><section class="builder-preview-panel"><div class="builder-preview-head"><div><strong>Prévia da página inicial</strong><small>As mudanças são salvas neste navegador</small></div><div class="builder-view-switch"><button class="${previewSize==='desktop'?'active':''}" onclick="storefront.setPreview('desktop')">Desktop</button><button class="${previewSize==='mobile'?'active':''}" onclick="storefront.setPreview('mobile')">Celular</button></div></div><div id="editor-preview">${preview()}</div></section></div>`}
  function render(){if(routePath().startsWith('/app/store-editor'))window.render()}
  function refresh(){const node=document.querySelector('#editor-preview');if(node)node.innerHTML=preview();const title=document.querySelector('.builder-section-row.active strong');if(title){const s=section();title.textContent=s.title||labels[s.type]}}
  function select(id){if(!home().sections.some(s=>s.id===id))return;selected=id;render()}
  function change(key,value){const s=section();if(!s)return;if(key.startsWith('items.')){const [,index,field]=key.split('.');if(!s.items?.[Number(index)]||!['title','body','icon'].includes(field))return;s.items[Number(index)][field]=value}else if(['eyebrow','title','subtitle','body','image','imageAlt','url','align','layout','buttonLabel','buttonLink','category','limit'].includes(key)){s[key]=key==='limit'?Math.max(1,Math.min(24,Number(value)||1)):value}else return;save();refresh()}
  function changeAnnouncement(key,value){if(!['enabled','text','highlight'].includes(key))return;home().announcement[key]=value;save();if(key==='enabled')render();else refresh()}
  function toggle(id,enabled){const s=home().sections.find(s=>s.id===id);if(!s)return;s.enabled=enabled;save();render()}
  function move(id,step){const list=home().sections,i=list.findIndex(s=>s.id===id),j=i+step;if(i<0||j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];save();render()}
  function addModal(){modal('Adicionar seção',`<p>Escolha o tipo de conteúdo para a página inicial. A nova seção começa oculta até você terminar de editar.</p><div class="builder-add-grid">${Object.entries(labels).map(([type,label])=>`<button onclick="storefront.add('${type}')">${icon(({banner:'image',image:'image',video:'eye',collection:'layers',text:'page',benefits:'shield'})[type])}<strong>${label}</strong></button>`).join('')}</div>`)}
  function add(type){if(!labels[type])return;const base={id:newId(),type,enabled:false};const presets={banner:{eyebrow:'NOVIDADES',title:'Uma novidade para sua casa',subtitle:'',image:'',imageAlt:'',buttonLabel:'Ver produtos',buttonLink:'/loja/catalogo',align:'left'},collection:{eyebrow:'EXPLORE A LOJA',title:'Nossa seleção',category:'Todos',limit:4},image:{eyebrow:'FORTE OUTLET',title:'Sua casa merece esse cuidado.',body:'',image:'',imageAlt:'',layout:'image-left',buttonLabel:'',buttonLink:'/loja/catalogo'},video:{eyebrow:'INSPIRE-SE',title:'Veja de perto',body:'',url:''},text:{eyebrow:'NOSSA HISTÓRIA',title:'Sua casa merece o melhor.',body:'',buttonLabel:'',buttonLink:'/loja/catalogo'},benefits:{items:structuredClone(defaultBenefits)}};Object.assign(base,presets[type]);home().sections.push(base);selected=base.id;save();closeModal();render();toast('Seção adicionada. Edite o conteúdo e ative a visibilidade.')}
  function duplicate(id){const list=home().sections,i=list.findIndex(s=>s.id===id);if(i<0)return;const copy=structuredClone(list[i]);copy.id=newId();copy.title=copy.title?`${copy.title} (cópia)`:copy.title;copy.enabled=false;list.splice(i+1,0,copy);selected=copy.id;save();render();toast('Seção duplicada e oculta para edição.')}
  function removeModal(id){const s=home().sections.find(s=>s.id===id);if(!s)return;modal('Excluir seção',`<p>Excluir <strong>${esc(s.title||labels[s.type])}</strong> da página inicial?</p><div class="form-actions"><button class="btn" onclick="closeModal()">Manter seção</button><button class="btn danger" onclick="storefront.remove('${id}')">Excluir seção</button></div>`)}

function toast(message){if($('#modal').open){let feedback=$('#modal-feedback');if(!feedback){feedback=document.createElement('div');feedback.id='modal-feedback';feedback.className='modal-feedback';feedback.setAttribute('role','alert');$('#modal').append(feedback)}feedback.textContent=message;feedback.scrollIntoView({block:'nearest'});return}$('#toast').textContent=message;$('#toast').classList.add('visible');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3800)}
function modal(title,html){$('#modal').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()" aria-label="Fechar">×</button></div><div class="modal-body">${html}</div>`;$('#modal').showModal()}
function closeModal(){$('#modal').close()}
const basePath=new URL(document.baseURI).pathname;
const hashRouting=true;
function routePath(){const hash=location.hash.slice(1);if(hash.startsWith('/'))return hash;if(location.protocol==='file:')return '/';const path=location.pathname;if(path===basePath+'index.html')return '/';return basePath!=='/'&&path.startsWith(basePath)?'/'+path.slice(basePath.length):path}
function go(path){if(location.protocol==='file:'){if(location.hash==='#'+path)render();else location.hash=path;window.scrollTo(0,0);return}history.pushState({},'',basePath+'#'+path);render();window.scrollTo(0,0)}
function normalizeLinks(){document.querySelectorAll('#app a[href^="/"]').forEach(a=>{const path=a.getAttribute('href');a.dataset.route=path;a.href=location.protocol==='file:'?'#'+path:basePath+'#'+path})}
document.addEventListener('click',e=>{const a=e.target.closest('a');const path=a?.dataset.route||a?.getAttribute('href');if(a&&path?.startsWith('/')&&a.target!=='_blank'&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&!e.altKey&&e.button===0){e.preventDefault();go(path)}});
window.addEventListener('popstate',()=>render());
window.addEventListener('hashchange',()=>render());
const navigation=[['dashboard','Visão geral','home'],['orders','Pedidos','bag'],['products','Produtos','box'],['collections','Coleções','layers'],['inventory','Estoque','store'],['customers','Clientes','users'],['reports','Relatórios','chart'],['label','CANAIS DE VENDA'],['store-editor','Loja online','store'],['pages','Páginas','page'],['label','ORGANIZAÇÃO'],['team','Equipe e permissões','users'],['settings','Configurações','settings']];
function shell(page,content){const label=navigation.find(x=>x[0]===page)?.[1]||'Pedido';return `<aside class="sidebar">${brand()}<button class="sidebar-close" aria-label="Fechar menu" onclick="document.querySelector('.sidebar').classList.remove('open')">×</button><nav>${navigation.map(([id,name,ic])=>id==='label'?`<div class="navlabel">${name}</div>`:allowed(id)?`<a class="navitem ${page===id?'active':''}" href="/app/${id==='dashboard'?'':id}">${icon(ic)}${name}${id==='orders'?`<span class="count">${visibleOrders().filter(o=>o.status==='pending').length}</span>`:''}</a>`:'').join('')}</nav><div class="sidebar-bottom"><a class="navitem" href="/loja" target="_blank" rel="noopener noreferrer">${icon('external')}Ver minha loja</a></div></aside><div class="sidebar-backdrop" onclick="document.querySelector('.sidebar').classList.remove('open')"></div><div class="shell"><header class="topbar"><div class="crumb"><button class="mobile-menu" aria-label="Abrir menu" onclick="$('.sidebar').classList.toggle('open')">${icon('menu')}</button></div><div class="top-actions"><button class="global-search" onclick="searchModal()">${icon('search')}<span>Buscar produtos, pedidos e clientes</span></button><button aria-label="Ver pendências" onclick="go('/app/orders')">${icon('bell')}</button><button class="account" onclick="roleModal()"><div class="avatar">${role==='Proprietário'?'GA':role==='Vendedor'?'LS':role==='Estoque'?'JS':'AL'}</div><span>${role==='Proprietário'?'Gabriel':role==='Vendedor'?'Ludmilla':role==='Estoque'?'João':'Amanda'}<small>${role}</small></span>${icon('down')}</button></div></header><main class="main">${content}<footer class="footer"><span>© 2026 Forte Outlet · Feito por Magemind.</span><span>Ambiente de demonstração · Dados salvos neste navegador</span></footer></main></div>`}
const heading=(title,sub,actions='')=>`<div class="heading"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="actions">${actions}</div></div>`;
function metrics(cards){return `<div class="metrics">${cards.map(c=>`<div class="card metric"><div class="metric-top">${c[0]}${icon(c[3]||'chart')}</div><strong>${c[1]}</strong><div class="metric-foot">${c[2]}</div></div>`).join('')}</div>`}
function orderTable(orders,compact=false){return `<div class="tablewrap"><table><thead><tr><th>Pedido</th><th>Cliente</th>${compact?'':'<th>Vendedor</th>'}<th>Status</th><th>Total</th>${compact?'':'<th>Origem</th>'}<th></th></tr></thead><tbody>${orders.map(o=>`<tr class="clickable" tabindex="0" onkeydown="if(event.key==='Enter'){this.click()}" onclick="go('/app/orders/${o.id}')"><td><strong style="font-weight:550">#${o.id}</strong><small style="display:block;margin-top:4px;font-size:10px">${new Date(o.date+'T12:00:00').toLocaleDateString('pt-BR')}</small></td><td><div class="customer"><span class="avatar">${initials(o.customer)}</span>${esc(o.customer)}</div></td>${compact?'':`<td>${esc(o.seller.split(' ')[0])}</td>`}<td>${badge(o)}</td><td style="font-weight:550">${money(orderTotal(o))}</td>${compact?'':`<td><span class="badge gray">${o.channel}</span></td>`}<td>${icon('chevron')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhum pedido encontrado.</td></tr>'}</tbody></table></div>`}
function dashboard(){const orders=visibleOrders(),sales=orders.filter(completed),revenue=sales.reduce((n,o)=>n+orderTotal(o)-o.freight,0),profit=sales.reduce((n,o)=>n+o.items.reduce((s,i)=>s+(i.price-i.cost)*i.qty,0),0),pending=orders.filter(o=>o.status==='pending'),ready=orders.filter(o=>o.status==='ready'),low=db.products.filter(p=>available(p.id)<=p.min);return heading('Seu negócio em um só lugar.','Bem-vindo de volta, '+(role==='Proprietário'?'Gabriel':role==='Vendedor'?'Ludmilla':role==='Estoque'?'João':'Amanda')+'. Veja o que acontece na sua loja.',button('Ver loja','onclick="go(\'/loja\')"','','external')+(canSell()?button('Nova pré-venda','onclick="newOrder()"','primary','plus'):''))+`<div class="welcome"><h2>Visão geral</h2><button class="btn small" onclick="periodModal()">${icon('calendar')} Histórico de demonstração ${icon('down')}</button></div>`+metrics([['Vendas realizadas',money(revenue),'<span class="change">'+sales.length+' vendas</span> com saída confirmada','wallet'],['Pedidos recebidos',orders.length,'Loja física e online','bag'],[canManage()?'Lucro bruto':'Aguardando pagamento',canManage()?money(profit):pending.length,canManage()?'Receita dos produtos − custo':'Pedidos que precisam de atenção','chart'],['Ticket médio',money(sales.length?revenue/sales.length:0),'Por venda realizada','layers']])+`<div class="dashboard-grid"><section class="card"><div class="card-header"><div><h2>Desempenho de vendas</h2><p>Vendas por semana · setembro e outubro</p></div><div class="chart-legend"><span><i class="dot"></i>Vendas</span></div></div>${salesChart(orders)}</section><section class="card"><div class="card-header"><h2>Precisa da sua atenção</h2><span class="alert-count">${pending.length+ready.length+low.length}</span></div><div class="tasks"><button class="task" onclick="orderFilter='pending';go('/app/orders')"><span class="task-symbol">${icon('wallet')}</span><span><strong>${pending.length} pagamentos pendentes</strong><small>Confira e anexe os comprovantes</small></span>${icon('chevron')}</button><button class="task" onclick="orderFilter='ready';go('/app/orders')"><span class="task-symbol blue">${icon('truck')}</span><span><strong>${ready.length} pedido pronto para sair</strong><small>Organize a próxima entrega</small></span>${icon('chevron')}</button><button class="task" onclick="go('/app/${allowed('inventory')?'inventory':'orders'}')"><span class="task-symbol red">${icon('box')}</span><span><strong>${low.length} produtos com estoque baixo</strong><small>Planeje a reposição da loja</small></span>${icon('chevron')}</button></div></section><section class="card" style="grid-column:1/-1"><div class="card-header"><div><h2>Pedidos recentes</h2><p>Acompanhe cada etapa, da reserva à entrega.</p></div><a class="text-link" href="/app/orders">Ver todos os pedidos</a></div>${orderTable(orders.slice(0,5),true)}</section></div><div class="bottom-grid"><section class="card"><div class="card-header"><h2>Mais vendidos</h2><a class="text-link" href="/app/${allowed('products')?'products':'orders'}">Ver detalhes</a></div>${db.products.map(p=>({...p,sold:sales.reduce((n,o)=>n+o.items.filter(i=>i.id===p.id).reduce((s,i)=>s+i.qty,0),0)})).sort((a,b)=>b.sold-a.sold).slice(0,3).map(p=>`<div class="product-row"><img src="${esc(p.image)}" alt="${esc(p.name)}"><div><strong>${esc(p.name)}</strong><small>${p.category}</small></div><div class="right"><strong>${p.sold} un.</strong><small>${money(p.price)}</small></div></div>`).join('')}<div style="height:15px"></div></section><section class="card"><div class="card-header"><h2>Sua loja online</h2><span class="badge green">Prévia disponível</span></div><div class="store-status">${icon('store')}<div><strong>forteoutlet.com.br</strong><small style="display:block;margin-top:5px">Domínio planejado · ainda não conectado</small></div></div><div class="pad" style="padding-top:0"><div class="total-line"><span class="muted">Produtos na vitrine</span><strong>${db.products.filter(p=>p.active).length}</strong></div><div class="total-line"><span class="muted">Pedidos pelo site</span><strong>${db.orders.filter(o=>o.channel==='Loja online').length}</strong></div><div class="actions" style="margin-top:15px">${canManage()?button('Personalizar loja','onclick="go(\'/app/store-editor\')"','','edit'):''}${button('Acessar loja','onclick="go(\'/loja\')"','','external')}</div></div></section></div>`}
function salesChart(orders){const groups=['15–18 set','19–22 set','23–26 set','27–30 set','01–02 out'];const values=groups.map((_,idx)=>orders.filter(o=>{const d=Number(o.date.slice(8));return idx===4?o.date.startsWith('2026-10'):o.date.startsWith('2026-09')&&d>=15+idx*4&&d<19+idx*4}).reduce((n,o)=>n+(completed(o)?orderTotal(o)-o.freight:0),0));const maximum=Math.max(4000,...values)*1.12;const points=values.map((v,i)=>`${55+i*126},${174-v/maximum*145}`);return `<div class="chart"><svg viewBox="0 0 610 210" preserveAspectRatio="none" role="img" aria-label="Vendas semanais: ${values.map(money).join(', ')}"><defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c30b" stop-opacity=".21"/><stop offset="1" stop-color="#f3c30b" stop-opacity=".015"/></linearGradient></defs>${[0,1,2,3].map(i=>`<line x1="49" x2="590" y1="${30+i*48}" y2="${30+i*48}" stroke="#edf0ef" stroke-dasharray="4 4"/><text x="0" y="${34+i*48}">${Math.round(maximum*(3-i)/3/1000)} mil</text>`).join('')}<path d="M${points.join(' L')} L559,175 L55,175Z" fill="url(#chartFill)"/><polyline points="${points.join(' ')}" fill="none" stroke="#dfb414" stroke-width="2.5" stroke-linejoin="round"/>${points.map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3" fill="#fff" stroke="#dfb414" stroke-width="2"/>`).join('')}${groups.map((g,i)=>`<text x="${55+i*126}" y="200" text-anchor="middle">${g}</text>`).join('')}</svg></div>`}

function render(){if(storefront.init(db))save();const path=routePath();if(path==='/')return go('/loja');if(path.startsWith('/loja')&&typeof renderStore==='function'){renderStore();normalizeLinks();return}if(path.startsWith('/imprimir/')&&typeof renderReceipt==='function'){renderReceipt(Number(path.split('/')[2]));normalizeLinks();return}let page=path.split('/')[2]||'dashboard';if(!allowed(page)){page='dashboard';location.protocol==='file:'?location.hash='/app':history.replaceState({},'',basePath+'#/app')}let content=page==='dashboard'?dashboard():typeof adminPage==='function'?adminPage(page):heading(navigation.find(x=>x[0]===page)?.[1]||'Gestão','Preparando sua loja…');$('#app').innerHTML=shell(page,content);normalizeLinks();document.title=(navigation.find(x=>x[0]===page)?.[1]||'Gestão')+' · Forte Outlet'}
function adminPage(page){const id=Number(routePath().split('/')[3]);switch(page){case'orders':return id?orderDetail(id):ordersPage();case'products':return productsPage();case'inventory':return inventoryPage();case'collections':return collectionsPage();case'customers':return customersPage();case'reports':return reportsPage();case'team':return teamPage();case'store-editor':return editorPage();case'pages':return pagesPage();case'settings':return settingsPage();default:return dashboard()}}
function ordersPage(){const orders=visibleOrders().filter(o=>(orderFilter==='all'||o.status===orderFilter)&&(`${o.id} ${o.customer} ${o.seller}`.toLowerCase().includes(orderQuery.toLowerCase())));return heading('Pedidos','Do primeiro atendimento à casa do cliente.',button('Exportar','onclick="exportOrders()"','','download')+(canSell()?button('Nova pré-venda','onclick="newOrder()"','primary','plus'):''))+`<section class="card"><div class="tabs">${[['all','Todos'],['pending','Pagamento pendente'],['ready','A preparar'],['transit','Em entrega'],['delivered','Concluídos'],['cancelled','Cancelados']].map(([id,label])=>`<button class="tab ${orderFilter===id?'active':''}" onclick="orderFilter='${id}';render()">${label}</button>`).join('')}</div><div class="toolbar"><form class="search" onsubmit="event.preventDefault();orderQuery=this.q.value;render()">${icon('search')}<input name="q" placeholder="Buscar pedido ou cliente" value="${esc(orderQuery)}" aria-label="Buscar pedido"><button aria-label="Buscar">${icon('chevron')}</button></form><span class="subtle">${orders.length} pedidos encontrados</span></div>${orderTable(orders)}</section>`}
function orderDetail(id){const o=visibleOrders().find(o=>o.id===id);if(!o)return heading('Pedido não encontrado','Este pedido não está disponível para o seu perfil.');const sale=completed(o);return `<a class="text-link" href="/app/orders">‹ Todos os pedidos</a><div style="height:19px"></div>`+heading(`Pedido #${o.id}`,`${o.channel} · ${new Date(o.date+'T12:00:00').toLocaleDateString('pt-BR')} · ${o.seller}`,(canPay()&&!completed(o)&&o.status!=='cancelled'?button('Editar dados',`onclick="editOrderModal(${o.id})"`,'','edit'):'')+button('Imprimir pedido',`onclick="go('/imprimir/${o.id}')"`,'','print'))+`<div class="two-col"><div class="stack"><section class="card"><div class="card-header"><h2>Itens do pedido</h2>${badge(o)}</div><div class="tablewrap"><table><thead><tr><th>Produto</th><th>Qtd.</th><th>Total</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price*i.qty)}</td></tr>`).join('')}</tbody></table></div><div class="pad"><div class="total-line"><span>Produtos</span><strong>${money(orderTotal(o)-o.freight)}</strong></div><div class="total-line"><span>Frete</span><span>${o.freightPending?'A combinar':money(o.freight)}</span></div><div class="total-line final"><span>Total do pedido</span><span>${money(orderTotal(o))}</span></div></div></section><section class="card"><div class="card-header"><h2>Pagamento e comprovante</h2><span class="badge ${o.paid?'green':'yellow'}">${o.paid?'Pago':'Pendente'}</span></div><div class="pad" style="padding-top:0"><div class="total-line"><span class="muted">Forma de pagamento</span><strong>${esc(o.payment)}</strong></div>${o.receipt&&o.receipt!=='demo'?`<img class="receipt-preview" src="${o.receipt}" alt="Comprovante anexado"><p class="subtle">Comprovante anexado neste navegador</p>`:o.receipt==='demo'?`<div class="notice">Pagamento de exemplo já confirmado. Este pedido inicial usa um comprovante fictício.</div>`:`<div class="notice">${o.status==='cancelled'?'Pedido cancelado. Não há pagamento a confirmar.':'Anexe a foto do comprovante para confirmar o pagamento. O pedido continua como pré-venda até a saída da mercadoria.'}</div>`}${canPay()&&!o.paid&&o.status!=='cancelled'?button('Anexar e confirmar pagamento',`onclick="paymentModal(${o.id})"`,'primary','wallet'):''}</div></section><section class="card pad"><h2>Observações do pedido</h2><p style="font-size:14px;line-height:1.7;margin-top:15px">${esc(o.notes||'Nenhuma observação adicionada.')}</p><div class="timeline"><p>Pedido criado · ${esc(o.date)} · ${esc(o.seller)}</p>${o.paid?'<p>Pagamento confirmado e comprovante registrado</p>':''}${sale?'<p>Mercadoria liberada · estoque atualizado · venda contabilizada</p>':''}${o.status==='delivered'?'<p>Entrega ou retirada concluída</p>':''}</div></section></div><div class="stack" style="align-content:start"><section class="card pad"><h2>Etapas do pedido</h2>${[['Pré-venda criada',o.status==='cancelled'?'Reserva liberada após cancelamento':'Produtos reservados no estoque',true],['Pagamento confirmado','Comprovante anexado ao pedido',o.paid],['Saída da mercadoria','Converte a pré-venda em venda',sale],['Pedido concluído','Entrega ou retirada confirmada',o.status==='delivered']].map((s,i)=>`<div class="progress-step ${s[2]?'done':''}"><span class="step-number">${s[2]?'✓':i+1}</span><div>${s[0]}<small>${s[1]}</small></div></div>`).join('')}<div style="margin-top:22px">${o.status==='ready'&&role!=='Vendedor'?button(o.delivery==='Retirada'?'Confirmar retirada':'Liberar para entrega',`onclick="dispatchOrder(${o.id})"`,'primary','truck'):o.status==='transit'&&role!=='Vendedor'?button('Confirmar entrega',`onclick="finishOrder(${o.id})"`,'primary','check'):o.status==='pending'?'<span class="subtle">Aguardando confirmação do pagamento.</span>':''}</div></section><section class="card pad"><h2>Cliente</h2><div class="customer" style="margin:20px 0"><span class="avatar">${initials(o.customer)}</span><strong style="font-size:14px">${esc(o.customer)}</strong></div><p style="font-size:13px;line-height:1.9">${esc(o.phone)}<br>${esc(o.email||'E-mail não informado')}<br>CPF: ${esc(o.cpf)}</p><h3 style="margin:22px 0 10px">${o.delivery==='Retirada'?'Retirada na loja':'Endereço de entrega'}</h3><p style="font-size:13px;line-height:1.8">${esc(o.address)}</p></section>${!sale&&o.status!=='cancelled'&&canManage()?`<div>${button('Cancelar pré-venda',`onclick="cancelOrderModal(${o.id})"`,'danger','trash')}</div>`:''}</div></div>`}
function field(label,name,value='',type='text',extra=''){return `<label class="field ${extra.includes('data-full')?'full':''}">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function parseAddress(value){const blank={cep:'',street:'',number:'',neighborhood:'',city:'',state:'',complement:''};if(value&&typeof value==='object')return {...blank,...value};const match=String(value||'').match(/^(.+?),\s*([^·]+)\s*·\s*([^·]+)\s*·\s*(.+?)\s*\/\s*([A-Za-z]{2})(?:\s*·\s*CEP\s*(\S+))?$/);return match?{...blank,street:match[1].trim(),number:match[2].trim(),neighborhood:match[3].trim(),city:match[4].trim(),state:match[5].toUpperCase(),cep:match[6]||''}:{...blank,street:String(value||'')}}
function addressFields(prefix='',values={}){const v=parseAddress(values),n=key=>prefix?prefix+key[0].toUpperCase()+key.slice(1):key;return `<div class="address-fields" id="${prefix||'admin'}-address-fields"><div class="form-grid">${field('CEP',n('cep'),v.cep,'text','required inputmode="numeric" placeholder="00000-000"')}${field('Rua / avenida',n('street'),v.street,'text','required')}${field('Número',n('number'),v.number,'text','required')}${field('Bairro',n('neighborhood'),v.neighborhood,'text','required')}${field('Cidade',n('city'),v.city,'text','required')}${field('Estado (UF)',n('state'),v.state,'text','required maxlength="2" placeholder="RJ"')}${field('Complemento (opcional)',n('complement'),v.complement,'text','data-full')}</div></div>`}
function addressFromForm(data,prefix=''){const n=key=>prefix?prefix+key[0].toUpperCase()+key.slice(1):key;return Object.fromEntries(['cep','street','number','neighborhood','city','state','complement'].map(key=>[key,String(data[n(key)]||'').trim()]))}
function formatAddress(a){return `${a.street}, ${a.number}${a.complement?' · '+a.complement:''} · ${a.neighborhood} · ${a.city} / ${a.state.toUpperCase()}${a.cep?' · CEP '+a.cep:''}`}
function toggleAdminDelivery(value){const group=$('#admin-address-fields');if(!group)return;const pickup=value==='Retirada';group.classList.toggle('disabled',pickup);group.querySelectorAll('input').forEach(input=>{input.disabled=pickup;input.required=!pickup&&input.name!=='complement'})}
function newOrder(){if(!canSell())return toast('Seu perfil não pode cadastrar pedidos.');modal('Nova pré-venda',`<form id="order-form" onsubmit="event.preventDefault();createAdminOrder(this)"><div class="notice">A mercadoria será reservada. A venda será contabilizada após o pagamento e a saída para entrega.</div><div class="form-grid">${field('Nome do cliente','customer','','text','required')}${field('Telefone / WhatsApp','phone','','tel','required')}${field('CPF','cpf','','text','required')}${field('E-mail (opcional)','email','','email')}<label class="field full">Recebimento<select name="delivery" onchange="toggleAdminDelivery(this.value)"><option>Entrega</option><option>Retirada</option></select></label>${addressFields()}<label class="field full">Produto<select name="product" required oninput="updateOrderEstimate()">${db.products.filter(p=>p.active&&available(p.id)>0).map(p=>`<option value="${p.id}">${esc(p.name)} · ${money(p.price)} · ${available(p.id)} disponíveis</option>`).join('')}</select></label>${field('Quantidade','qty',1,'number','min="1" max="99" required oninput="updateOrderEstimate()"')}<label class="field">Vendedor<select name="seller">${(role==='Vendedor'?[{name:currentSeller}]:db.team.filter(t=>t.active&&['Vendedor','Gerente','Proprietário'].includes(t.role))).map(t=>`<option>${esc(t.name)}</option>`).join('')}</select></label><label class="field">Pagamento<select name="payment"><option>Pix</option><option>Cartão de crédito</option><option>Cartão de débito</option><option>Dinheiro</option></select></label>${field('Frete (R$)','freight',0,'number','min="0" step="0.01" required oninput="updateOrderEstimate()"')}<label class="field full">Observações<textarea name="notes" placeholder="Preferência de entrega, referência do endereço…"></textarea></label></div><div class="total-line final"><span>Total</span><span id="order-estimate">${money(db.products.find(p=>p.active&&available(p.id)>0)?.price)}</span></div><div class="form-actions">${button('Cancelar','type="button" onclick="closeModal()"')}<button class="btn primary">Criar pré-venda</button></div></form>`)}
function updateOrderEstimate(){const f=$('#order-form');const p=db.products.find(p=>p.id===Number(f.product.value));$('#order-estimate').textContent=money((p?.price||0)*Number(f.qty.value)+Number(f.freight.value))}
function createAdminOrder(form){if(!canSell())return;const f=Object.fromEntries(new FormData(form));const p=db.products.find(p=>p.id===Number(f.product));const qty=Number(f.qty);if(!p||!Number.isInteger(qty)||qty<1||qty>available(p.id))return toast('Quantidade indisponível em estoque.');const addressParts=f.delivery==='Retirada'?(db.settings.addressParts||parseAddress(db.settings.address)):addressFromForm(f);const o={...f,addressParts,address:f.delivery==='Retirada'?db.settings.address:formatAddress(addressParts),id:Math.max(1000,...db.orders.map(o=>o.id))+1,date:new Date().toLocaleDateString('en-CA'),freight:Number(f.freight),items:[{id:p.id,name:p.name,price:p.price,cost:p.cost,qty}],status:'pending',paid:false,receipt:null,channel:'Loja física',seller:role==='Vendedor'?currentSeller:f.seller};db.orders.unshift(o);if(save()){closeModal();go('/app/orders/'+o.id);toast('Pré-venda criada. Produtos reservados.')}}
function paymentModal(id){const o=visibleOrders().find(o=>o.id===id);if(!o||!canPay()||o.status!=='pending')return;if(o.freightPending)return toast('Confirme o frete em Editar dados antes de receber o pagamento.');modal('Confirmar pagamento',`<form onsubmit="event.preventDefault();confirmPayment(${id},this)"><p>Pedido <strong>#${id}</strong> · ${esc(o.customer)}<br>Total a confirmar: <strong>${money(orderTotal(o))}</strong></p><label class="field">Foto do comprovante<input type="file" name="receipt" accept="image/png,image/jpeg,image/webp" required></label><p class="subtle" style="margin-top:10px">PNG, JPG ou WebP · até 2 MB. Use um arquivo de teste.</p><label style="display:flex;gap:9px;font-size:13px;line-height:1.6"><input type="checkbox" required>Conferi o valor recebido e o comprovante deste pedido.</label><div class="form-actions">${button('Cancelar','type="button" onclick="closeModal()"')}<button class="btn primary">Confirmar pagamento</button></div></form>`)}
async function imageData(file){if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>2*1024*1024)throw Error('Selecione uma imagem PNG, JPG ou WebP de até 2 MB.');return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Não foi possível ler a imagem.'));r.readAsDataURL(file)})}
async function confirmPayment(id,form){const o=visibleOrders().find(o=>o.id===id);if(!o||!canPay()||o.status!=='pending')return;try{const data=await imageData(form.receipt.files[0]);o.receipt=data;o.paid=true;o.status='ready';if(!save()){o.receipt=null;o.paid=false;o.status='pending';return}closeModal();render();toast('Pagamento confirmado. Pedido pronto para preparação.')}catch(e){toast(e.message)}}
function dispatchOrder(id){const o=db.orders.find(o=>o.id===id);if(!o||role==='Vendedor'||!o.paid||!o.receipt||o.status!=='ready')return toast('Confirme o pagamento com comprovante antes da saída.');for(const i of o.items){const p=db.products.find(p=>p.id===i.id);if(!p||p.stock<i.qty)return toast('Estoque insuficiente para liberar o pedido.')}modal(o.delivery==='Retirada'?'Confirmar retirada':'Liberar para entrega',`<p>Confirmar a saída do pedido <strong>#${id}</strong>? Esta ação dará baixa em ${o.items.reduce((n,i)=>n+i.qty,0)} item(ns) e contabilizará ${money(orderTotal(o)-o.freight)} em vendas.</p><div class="form-actions">${button('Voltar','onclick="closeModal()"')}${button('Confirmar saída',`onclick="commitDispatch(${id})"`,'primary')}</div>`)}
function commitDispatch(id){const o=db.orders.find(o=>o.id===id);if(!o||role==='Vendedor'||o.status!=='ready'||!o.paid||!o.receipt)return;for(const i of o.items){const p=db.products.find(p=>p.id===i.id);if(!p||p.stock<i.qty)return toast('O estoque mudou. Confira os itens.')}o.items.forEach(i=>{db.products.find(p=>p.id===i.id).stock-=i.qty;db.movements.unshift({id:Date.now()+i.id,product:i.name,qty:-i.qty,reason:'Saída do pedido #'+id,date:new Date().toLocaleString('pt-BR'),by:currentProfile?.name||'Grupo Outlet'})});o.status=o.delivery==='Retirada'?'delivered':'transit';save();closeModal();render();toast('Saída registrada. Estoque e vendas atualizados.')}
function finishOrder(id){const o=db.orders.find(o=>o.id===id);if(!o||o.status!=='transit'||role==='Vendedor')return;o.status='delivered';save();render();toast('Entrega concluída.')}
function cancelOrderModal(id){if(!canManage())return;modal('Cancelar pré-venda',`<p>O pedido #${id} será cancelado e os produtos reservados voltarão a ficar disponíveis.${db.orders.find(o=>o.id===id)?.paid?' O pagamento já confirmado deve ser estornado separadamente; este protótipo não realiza reembolsos.':''}</p><div class="form-actions">${button('Manter pedido','onclick="closeModal()"')}${button('Cancelar pré-venda',`onclick="cancelOrder(${id})"`,'danger')}</div>`)}

function exportOrders(){downloadCSV('pedidos-forte-outlet.csv',[['Pedido','Cliente','Data','Vendedor','Status','Total'],...visibleOrders().map(o=>[o.id,o.customer,o.date,o.seller,statuses[o.status][0],orderTotal(o).toFixed(2)])])}
function exportReport(){if(!canManage())return;downloadCSV('lucro-bruto-forte-outlet.csv',[['Pedido','Data','Vendedor','Receita de produtos','Custo','Lucro bruto'],...db.orders.filter(completed).map(o=>{const sale=orderTotal(o)-o.freight,cost=o.items.reduce((n,i)=>n+i.cost*i.qty,0);return[o.id,o.date,o.seller,sale.toFixed(2),cost.toFixed(2),(sale-cost).toFixed(2)]})])}

function shopProduct(p){return `<article class="shop-product"><a href="/loja/produto/${p.id}"><div class="product-photo"><img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"></div><h3>${esc(p.name)}</h3></a><div class="price">${money(p.price)}</div><small>${available(p.id)>0?'Disponível · pagamento combinado com a loja':'Temporariamente indisponível'}</small>${button(available(p.id)>0?'Adicionar ao carrinho':'Sem estoque',`onclick="addToCart(${p.id})" ${available(p.id)>0?'':'disabled'}`,'','plus')}</article>`}
function storeHome(){return storefront.storeHome()}
function catalogPage(){const products=db.products.filter(p=>p.active&&(catalogCategory==='Todos'||p.category===catalogCategory)&&p.name.toLowerCase().includes(catalogQuery.toLowerCase()));return `<div class="store-content">${heading(catalogCategory==='Todos'?'Encontre o seu próximo móvel':esc(catalogCategory),'Conforto, praticidade e preços que cabem nos seus planos.')}<div class="toolbar" style="padding:0 0 25px"><form class="search" onsubmit="event.preventDefault();catalogQuery=this.q.value;render()">${icon('search')}<input name="q" value="${esc(catalogQuery)}" placeholder="Buscar na coleção" aria-label="Buscar na coleção"><button aria-label="Buscar">${icon('chevron')}</button></form><div class="actions"><select class="control" style="width:auto" aria-label="Filtrar coleção" onchange="catalogCategory=this.value;render()">${['Todos',...db.collections].map(c=>`<option ${c===catalogCategory?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="subtle">${products.length} produtos</span></div></div><div class="catalog">${products.map(shopProduct).join('')}</div>${products.length?'':'<div class="empty">Nenhum produto encontrado. Experimente outra busca.</div>'}</div>`}
function productPage(id){const p=db.products.find(p=>p.id===id&&p.active);if(!p)return '<div class="empty">Este produto não está disponível. <a href="/loja/catalogo">Voltar ao catálogo</a></div>';return `<div class="store-content"><a class="text-link" href="/loja/catalogo">Loja / ${esc(p.category)}</a><section class="detail-product"><img src="${esc(p.image)}" alt="${esc(p.name)}"><div><h1>${esc(p.name)}</h1><span class="subtle">Código: ${esc(p.sku)}</span><p>${esc(p.description)}</p><div class="price">${money(p.price)}</div><p style="font-size:13px;margin-top:-10px">Pagamento combinado com nossa equipe pelo WhatsApp.</p><div class="actions"><label class="field" style="max-width:85px">Qtd.<input id="detail-qty" type="number" value="1" min="1" max="${available(p.id)}" aria-label="Quantidade"></label>${button(available(p.id)>0?'Adicionar ao carrinho':'Sem estoque',`onclick="addToCart(${id},Number($('#detail-qty').value))" ${available(p.id)>0?'':'disabled'}`,'primary','bag')}</div><div class="benefit" style="justify-content:flex-start;border:0">${icon('shield')}<div><strong>Você compra com acompanhamento</strong><small>Finalize seu pedido e combine tudo com a nossa equipe.</small></div></div></div></section></div>`}
function addToCart(id,qty=1){const p=db.products.find(p=>p.id===id&&p.active),line=db.cart.find(i=>i.id===id);if(!p||!Number.isInteger(qty)||qty<1||qty+(line?.qty||0)>available(id))return toast('Quantidade indisponível. Confira o estoque.');if(line)line.qty+=qty;else db.cart.push({id,qty});save();render();toast('Produto adicionado ao carrinho.')}
function changeCart(id,delta){const line=db.cart.find(i=>i.id===id);if(!line)return;if(delta>0&&line.qty+delta>available(id))return toast('Você atingiu a quantidade disponível.');line.qty+=delta;if(line.qty<=0)db.cart=db.cart.filter(i=>i.id!==id);save();render()}
const cartTotal=()=>db.cart.reduce((n,i)=>n+salePrice(db.products.find(p=>p.id===i.id))*i.qty,0);
function cartPage(){return `<div class="store-content">${heading('Seu carrinho','Falta pouco para deixar sua casa do seu jeito.')} ${db.cart.length?`<div class="two-col"><section class="card pad">${db.cart.map(i=>{const p=db.products.find(p=>p.id===i.id);if(!p)return'';return `<div class="cart-line"><img src="${esc(p.image)}" alt="${esc(p.name)}"><div><h3>${esc(p.name)}</h3><span class="subtle">${money(p.price)} / un.</span><div style="margin-top:10px" class="qty"><button onclick="changeCart(${i.id},-1)" aria-label="Diminuir quantidade">−</button><span>${i.qty}</span><button onclick="changeCart(${i.id},1)" aria-label="Aumentar quantidade">+</button></div></div><div class="right"><strong>${money(p.price*i.qty)}</strong><button style="display:block;margin:15px 0 0 auto" onclick="db.cart=db.cart.filter(i=>i.id!==${i.id});save();render()" aria-label="Remover produto">${icon('trash')}</button></div></div>`}).join('')}<a href="/loja/catalogo" class="text-link" style="display:block;margin-top:23px">Continuar comprando</a></section><section class="card pad" style="align-self:start"><h2>Resumo do pedido</h2><div class="total-line" style="margin-top:20px"><span>Produtos</span><strong>${money(cartTotal())}</strong></div><div class="total-line"><span>Frete</span><span class="subtle">A combinar</span></div><div class="total-line final"><span>Subtotal</span><span>${money(cartTotal())}</span></div><a href="/loja/checkout" class="btn primary" style="width:100%;margin-top:20px">Continuar para os dados</a><p class="subtle" style="line-height:1.7;margin-top:17px">Seu pedido será enviado para análise. O pagamento é combinado com a equipe após a confirmação.</p></section></div>`:`<div class="empty">${icon('bag')}<h2 style="margin:20px 0">Seu carrinho ainda está vazio.</h2><p style="margin-bottom:20px">Encontre o móvel que está faltando na sua casa.</p><a class="btn primary" href="/loja/catalogo">Explorar produtos</a></div>`}</div>`}
function checkoutPage(){if(!db.cart.length)return cartPage();return `<div class="store-content">${heading('Vamos preparar seu pedido','Preencha seus dados. Nossa equipe combina os próximos passos com você.')}<form onsubmit="event.preventDefault();checkout(this)"><div class="two-col"><section class="card pad"><h2 style="margin-bottom:23px">Seus dados</h2><div class="form-grid">${field('Nome completo','customer','','text','required autocomplete="name"')}${field('E-mail','email',sessionStore.getItem('forte-customer')||'','email','required autocomplete="email"')}${field('CPF','cpf','','text','required inputmode="numeric" pattern="[0-9.\u002d]{11,14}" title="Informe o CPF com 11 números"')}${field('Telefone / WhatsApp','phone','','tel','required autocomplete="tel"')}<label class="field full">Como prefere receber?<select name="delivery" onchange="toggleDelivery(this.value)"><option>Entrega</option><option>Retirada</option></select></label></div><div id="delivery-fields" class="form-grid" style="margin-top:23px">${field('CEP','cep','','text','required autocomplete="postal-code"')}${field('Cidade / UF','city','','text','required autocomplete="address-level2"')}${field('Rua / avenida','street','','text','required autocomplete="address-line1"')}${field('Número','number','','text','required')}${field('Bairro','neighborhood','','text','required')}${field('Complemento (opcional)','complement','','text')}</div><h2 style="margin:28px 0 18px">Pagamento</h2><label class="field">Como pretende pagar?<select name="payment"><option>Pix</option><option>Cartão de crédito</option><option>Cartão de débito</option><option>Dinheiro</option></select></label><label class="field" style="margin-top:20px">Observações (opcional)<textarea name="notes" placeholder="Algum detalhe que nossa equipe precisa saber?"></textarea></label></section><section class="card pad" style="align-self:start"><h2>Seu pedido</h2>${db.cart.map(i=>{const p=db.products.find(p=>p.id===i.id);return `<div class="cart-line"><img src="${esc(p.image)}" alt=""><div><h3>${esc(p.name)}</h3><small class="cart-options">${esc(optionText(i.options))}</small><small>${i.qty} × ${money(salePrice(p))}</small></div></div>`}).join('')}<div class="total-line"><span>Frete</span><span class="subtle">A confirmar no atendimento</span></div><div class="total-line final"><span>Subtotal</span><span>${money(cartTotal())}</span></div><div class="notice" style="margin-top:20px">Nenhuma cobrança será feita agora. Seu pedido ficará pendente até a confirmação do pagamento pela equipe.</div><button class="btn primary" style="width:100%;margin-top:22px">Finalizar pedido</button></section></div></form></div>`}
function toggleDelivery(value){const el=$('#delivery-fields');el.style.display=value==='Retirada'?'none':'grid';el.querySelectorAll('input').forEach(i=>i.required=value!=='Retirada'&&i.name!=='complement')}

function safeJson(value, fallback) {
  try { return JSON.parse(value); } catch { return fallback; }
}
function currentEmail() { return authSession?.user?.email?.toLowerCase() || ''; }
function requestHeaders(authenticated = false) {
  const headers = { apikey: backendKey, 'Content-Type': 'application/json' };
  if (authenticated && authSession?.access_token) headers.Authorization = `Bearer ${authSession.access_token}`;
  return headers;
}
async function backendRequest(path, options = {}, authenticated = false) {
  if (authenticated) await refreshAuth();
  const response = await fetch(backendUrl + path, {
    ...options,
    headers: { ...requestHeaders(authenticated), ...(options.headers || {}) }
  });
  if (!response.ok) {
    const problem = await response.json().catch(() => ({}));
    throw new Error(problem.message || problem.error_description || `Falha no serviço (${response.status}).`);
  }
  if (response.status === 204) return null;
  return response.json();
}
function rememberAuth(session) {
  authSession = {
    ...session,
    expires_at: session.expires_at || Math.floor(Date.now() / 1000) + (session.expires_in || 3600)
  };
  sessionStore.setItem(authStorageKey, JSON.stringify(authSession));
  sessionStore.setItem('forte-customer', currentEmail());
}
async function refreshAuth() {
  if (!authSession?.refresh_token) return;
  if (authSession.expires_at > Math.floor(Date.now() / 1000) + 60) return;
  const response = await fetch(backendUrl + '/auth/v1/token?grant_type=refresh_token', {
    method: 'POST', headers: requestHeaders(), body: JSON.stringify({ refresh_token: authSession.refresh_token })
  });
  if (!response.ok) {
    authSession = null;
    sessionStore.removeItem(authStorageKey);
    sessionStore.removeItem('forte-customer');
    throw new Error('Sua sessão expirou. Entre novamente.');
  }
  rememberAuth(await response.json());
}

async function signInMaster(form) {
  const button = form.querySelector('button[type="submit"], button:not([type])');
  const passwordInput = form.elements.namedItem('password');
  if (button) button.disabled = true;
  try {
    const response = await fetch(backendUrl + '/auth/v1/token?grant_type=password', {
      method: 'POST', headers: requestHeaders(),
      body: JSON.stringify({ email: ownerEmail, password: passwordInput.value })
    });
    if (!response.ok) throw new Error('E-mail ou senha incorretos.');
    const session = await response.json();
    if (session.user?.email?.toLowerCase() !== ownerEmail) throw new Error('Conta sem acesso à gestão.');
    rememberAuth(session);
    await boot();
  } catch (error) {
    toast(error.message);
  } finally {
    passwordInput.value = '';
    if (button) button.disabled = false;
  }
}
render = function () {
  if (!booted) {
    $('#app').innerHTML = '<main class="boot-fallback"><h1>Grupo Outlet</h1><p>Carregando loja...</p></main>';
    return;
  }
  const path = routePath();
  if ((path.startsWith('/app') || path.startsWith('/imprimir/')) && !isOwner) {
    ownerLoginPage();
    return;
  }
  originalRender();
};

save = function () {
  try {
    localStore.setItem(cartStorageKey, JSON.stringify(db.cart || []));
  } catch { toast('Não foi possível salvar o carrinho neste navegador.'); }
  if (!isOwner) return true;
  const state = { ...db };
  delete state.cart;
  const next = JSON.stringify(state);
  if (next === savedState || next === pendingState) return true;
  pendingState = next;
  clearTimeout(persistTimer);
  persistTimer = setTimeout(persistAdminState, 180);
  return true;
};
async function persistAdminState() {
  if (persisting || !pendingState) return;
  persisting = true;
  const next = pendingState;
  pendingState = '';
  try {
    const rows = await backendRequest(`/rest/v1/app_state?id=eq.1&version=eq.${stateVersion}&select=version`, {
      method: 'PATCH', headers: { Prefer: 'return=representation' },
      body: JSON.stringify({ data: JSON.parse(next), version: stateVersion + 1, updated_at: new Date().toISOString() })
    }, true);
    if (!rows?.length) throw new Error('Os dados mudaram em outra sessão. A página será atualizada.');
    stateVersion = rows[0].version;
    savedState = next;
  } catch (error) {
    pendingState = '';
    toast(`Não foi possível salvar: ${error.message}`);
    setTimeout(boot, 2500);
  } finally {
    persisting = false;
    if (pendingState && pendingState !== savedState) persistAdminState();
  }
}

          : currentProfile.position === 'Gerente' ? 'Gerente'
          : currentProfile.position === 'Vendedor' ? 'Vendedor' : 'Estoque';
        currentSeller = currentProfile.name || '';
        accountProfiles = await backendRequest('/rest/v1/profiles?select=user_id,email,name,role,position,created_at&order=created_at.desc', {}, true);
        customerContacts = await backendRequest('/rest/v1/customer_contacts?select=id,name,email,phone,cpf,address,created_at&order=created_at.desc', {}, true);
      } else if (currentProfile?.role === 'driver') {
        role = 'Entregador';
        driverDeliveries = await backendRequest('/rest/v1/rpc/driver_deliveries', { method: 'POST', body: '{}' }, true);
      } else {
        await loadMyOrders();
      }
    }
    const orderId = Number(routePath().match(/^\/loja\/pedido\/(\d+)$/)?.[1]);
    const token = orderId && sessionStore.getItem('forte-guest-order-' + orderId);
    if (token && !db.orders.some(order => order.id === orderId)) {
      const order = await backendRequest('/rest/v1/rpc/guest_order', {
        method: 'POST', body: JSON.stringify({ p_order_id: orderId, p_token: token })
      });
      if (order?.id) db.orders.unshift(order);
    }
    booted = true;
    render();
  } catch (error) {
    bootError = error.message;
    booted = true;
    render();
  }
}

async function signInAccount(form) {
  const button = form.querySelector('button');
  const emailInput = form.elements.namedItem('email');
  const passwordInput = form.elements.namedItem('password');
  button.disabled = true;
  try {
    const response = await fetch(backendUrl + '/auth/v1/token?grant_type=password', {
      method: 'POST', headers: requestHeaders(),
      body: JSON.stringify({ email: emailInput.value.trim().toLowerCase(), password: passwordInput.value })
    });
    if (!response.ok) throw new Error('E-mail ou senha incorretos.');
    rememberAuth(await response.json());
    await boot();
    if (currentProfile?.role === 'driver') go('/app/deliveries');
    else if (isOwner) go('/app');
    else go(sessionStore.getItem('forte-after-login') || '/loja/conta');
    sessionStore.removeItem('forte-after-login');
  } catch (error) { toast(error.message); }
  finally { passwordInput.value = ''; button.disabled = false; }
}
async function registerAccount(form) {
  const button = form.querySelector('button');
  const emailInput = form.elements.namedItem('email');
  const passwordInput = form.elements.namedItem('password');
  const nameInput = form.elements.namedItem('name');
  button.disabled = true;
  try {
    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;
    const name = nameInput.value.trim();
    if (name.length < 2) throw new Error('Informe seu nome completo.');
    const response = await fetch(backendUrl + '/auth/v1/signup', {
      method: 'POST', headers: requestHeaders(),
      body: JSON.stringify({ email, password, data: { name } })
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.msg || result.message || 'Não foi possível criar a conta.');
    if (!result.access_token) throw new Error('O cadastro não foi concluído. Tente novamente em instantes.');
    rememberAuth(result);
    await boot();
    go(sessionStore.getItem('forte-after-login') || '/loja/conta');
    sessionStore.removeItem('forte-after-login');
    toast('Conta criada. Boas-vindas ao Grupo Outlet!');
  } catch (error) { toast(error.message); }
  finally { passwordInput.value = ''; button.disabled = false; }
}

const renderBeforeAccounts = render;
render = function () {
  if (!booted) return renderBeforeAccounts();
  if (bootError) {
    $('#app').innerHTML = `<main class="boot-fallback"><h1>Não foi possível carregar a loja</h1><p>${esc(bootError)}</p><button class="btn" onclick="boot()">Tentar novamente</button></main>`;
    return;
  }
  const path = routePath();
  if (path === '/loja/conta' && !authSession) {
    const signup = sessionStore.getItem('forte-open-signup') === '1';
    sessionStore.removeItem('forte-open-signup');
    return authPage(signup ? 'signup' : 'login');
  }
  if ((path.startsWith('/app') || path.startsWith('/imprimir/')) && !isOwner) {
    if (authSession) return go('/loja/conta');
    return authPage();
  }
  return renderBeforeAccounts();
};

accountPage = () => {
  if (!authSession) return authPage();
  const orders = db.orders.filter(o => o.user_id === authSession.user.id);

  return `<div class="store-content account-content">${heading('Minha conta', esc(currentProfile?.name || currentEmail()),
    `${adminLink}${button('Sair', 'onclick="signOut()"', '', 'logout')}`)}
    <section class="card pad"><h2>Meus pedidos</h2><div class="stack" style="margin-top:18px">
      ${orders.map(o => `<a class="total-line" href="/loja/pedido/${o.id}"><span>Pedido #${o.id} · ${esc(o.date)}</span><strong>${money(orderTotal(o))}</strong></a>`).join('') || '<p class="muted">Você ainda não tem pedidos. <a href="/loja/catalogo">Explore os produtos.</a></p>'}

function promoteModal(id) {
  if (currentProfile?.role !== 'master') return;
  const profile = accountProfiles.find(p => p.user_id === id && p.role === 'customer');
  if (!profile) return toast('Cliente não encontrado.');
  modal('Transformar em admin', `<p><strong>${esc(profile.name || profile.email)}</strong> terá acesso à gestão e sairá da lista de clientes.</p>
    <form onsubmit="event.preventDefault();promoteCustomer(this,'${id}')"><label class="field">Cargo<select name="position"><option>Gerente</option><option>Vendedor</option><option>Entregador</option><option>Outro</option></select></label>
    <div class="form-actions">${button('Cancelar', 'type="button" onclick="closeModal()"')}<button class="btn primary">Confirmar alteração</button></div></form>`);
}
async function promoteCustomer(form, id) {
  const button = form.querySelector('button[type=submit],button:not([type])');
  button.disabled = true;
  try {
    await backendRequest('/rest/v1/rpc/promote_customer', { method: 'POST', body: JSON.stringify({ p_user_id: id, p_position: form.elements.namedItem('position').value }) }, true);
    accountProfiles = await backendRequest('/rest/v1/profiles?select=user_id,email,name,role,position,created_at&order=created_at.desc', {}, true);
    closeModal(); render(); toast('Perfil de administrador atualizado.');
  } catch (error) { toast(error.message); button.disabled = false; }
}

async function uploadProductPhoto(file) {
  const ext = file.type === 'image/png' ? 'png' : file.type === 'image/webp' ? 'webp' : 'jpg';
  const path = `products/${crypto.randomUUID()}.${ext}`;
  await refreshAuth();
  const response = await fetch(`${backendUrl}/storage/v1/object/${photoBucket}/${path}`, {
    method: 'POST',
    headers: { apikey: backendKey, Authorization: `Bearer ${authSession.access_token}`, 'Content-Type': file.type, 'x-upsert': 'false' },
    body: file
  });
  if (!response.ok) {
    const problem = await response.json().catch(() => ({}));
    throw new Error(problem.message || 'Não foi possível enviar a foto.');
  }
  return `${backendUrl}/storage/v1/object/public/${photoBucket}/${path}`;
}
async function saveProduct(form, id) {
  if (!canManage()) return;
  const files = Array.from(form.querySelector('input[name="photos"]').files);
  if (draftImages.length + files.length > maxPhotos) return toast('O produto pode ter no máximo 10 fotos.');
  if (files.some(file => file.size > maxPhotoBytes || !['image/jpeg', 'image/png', 'image/webp'].includes(file.type))) return toast('Cada foto deve ser JPG, PNG ou WebP e ter no máximo 7 MB.');
  if (!draftImages.length && !files.length) return toast('Envie pelo menos uma foto do produto.');
  const f = Object.fromEntries(new FormData(form));
  const price = Number(f.price), promoPrice = f.promoPrice ? Number(f.promoPrice) : null;
  const requestedSku = String(f.sku || '').trim();
  const stock = Number(f.stock), min = Number(f.min);
  let variations;
  try { variations = readVariationEditor(form); }
  catch (error) { return toast(error.message); }
  if (!(price > 0) || (promoPrice !== null && !(promoPrice > 0 && promoPrice < price))) return toast('O preço promocional deve ser maior que zero e menor que o preço de venda.');
  if (!Number.isInteger(stock) || !Number.isInteger(min) || stock < 0 || min < 0 || (id && stock < reserved(id))) return toast('Confira o estoque. A quantidade não pode ficar abaixo do total reservado.');
  const previous = db.products.find(product => product.id === id);
  if (id && !previous) return toast('Produto não encontrado. Atualize a página e tente novamente.');
  const newId = id || Math.max(Number(db.nextProductId) || 1, Math.max(0, ...db.products.map(product => product.id)) + 1);
  const sku = requestedSku || `GO-${String(newId).padStart(5, '0')}`;
  if (sku.length > 60) return toast('O SKU pode ter até 60 caracteres.');
  if (db.products.some(product => product.id !== newId && product.sku?.toLocaleLowerCase('pt-BR') === sku.toLocaleLowerCase('pt-BR')))
    return toast('Já existe um produto com esse SKU / código.');
  const button = form.querySelector('button.btn.primary');
  button.disabled = true;
  try {
    const uploaded = [];
    for (const file of files) uploaded.push(await uploadProductPhoto(file));
    const images = [...draftImages, ...uploaded];
    const data = { name: f.name.trim(), sku, category: f.category, description: f.description.trim(), price, promoPrice, cost: Number(f.cost), stock, min, active: f.active === 'true', image: images[0], images, variations };
    if (!data.name || !data.description || !Number.isFinite(data.cost) || data.cost < 0) throw new Error('Confira os dados do produto.');
    if (previous) {
      const difference = stock - previous.stock;
      Object.assign(previous, data);
      if (difference) db.movements.unshift({ id: Date.now(), product: data.name, qty: difference, reason: 'Ajuste na edição do produto', date: new Date().toLocaleString('pt-BR'), by: currentProfile?.name || 'Grupo Outlet' });
    } else {
      db.products.push({ ...data, id: newId });
      db.nextProductId = newId + 1;
    }
    save(); clearTimeout(persistTimer); await persistAdminState();
    closeModal(); render(); toast('Produto salvo. Estoque e vitrine atualizados.');
  } catch (error) { toast(error.message); button.disabled = false; }
}
async function deleteProduct(id) {
  if (!canManage()) return;
  const product = db.products.find(p => p.id === id);
  if (!product || !confirm(`Excluir "${product.name}" do catálogo?`)) return;
  db.products = db.products.filter(p => p.id !== id);
  db.cart = db.cart.filter(i => i.id !== id);
  save(); clearTimeout(persistTimer); await persistAdminState();
  render(); toast('Produto excluído do catálogo.');
}

const checkoutBeforePromotions = checkoutPage;
checkoutPage = () => {
  if (!db.cart.length) return cartPage();
  let html = checkoutBeforePromotions();
  if (authSession) html = html.replace(/name="customer" type="text" value="[^"]*"/, `name="customer" type="text" value="${esc(currentProfile?.name || '')}"`)
    .replace(/name="email" type="email" value="[^"]*"/, `name="email" type="email" value="${esc(currentEmail())}" readonly`);
  for (const item of db.cart) {
    const product = db.products.find(p => p.id === item.id);
    if (product && salePrice(product) < product.price)
      html = html.replace(`${item.qty} × ${money(product.price)}`, `${item.qty} × ${money(salePrice(product))}`);
  }
  return html;
};
checkout = async form => {
  if (!authSession?.user?.id) return toast('Entre na sua conta para finalizar o pedido.');
  if (!db.cart.length) return toast('Seu carrinho está vazio.');
  const f = Object.fromEntries(new FormData(form));
  if (f.cpf.replace(/\D/g, '').length !== 11) return toast('Informe um CPF com 11 números.');
  if (f.email.trim().toLowerCase() !== currentEmail()) return toast('Use o e-mail da sua conta.');
  for (const item of db.cart) {
    const product = db.products.find(p => p.id === item.id && p.active);
    if (!product || !Number.isInteger(item.qty) || item.qty < 1 || cartQuantity(item.id) > available(item.id))
      return toast('O estoque mudou. Revise o carrinho antes de continuar.');
    try { validateProductOptions(product, item.options || {}); }
    catch { return toast('Uma variação do carrinho mudou. Remova o item e escolha novamente.'); }
  }
  const address = f.delivery === 'Retirada' ? db.settings.address
    : `${f.street}, ${f.number}${f.complement ? ' · ' + f.complement : ''} · ${f.neighborhood} · ${f.city} · CEP ${f.cep}`;
  if (!address || address.trim().length < 8) return toast('Confira o endereço antes de continuar.');
  const submit = form.querySelector('button[type="submit"],button.btn.primary');
  submit.disabled = true;
  try {
    const request = { customer: f.customer.trim(), email: currentEmail(), phone: f.phone.trim(), cpf: f.cpf.trim(),
      address: address.trim(), delivery: f.delivery, payment: f.payment, notes: f.notes,
      items: db.cart.map(item => ({ id: item.id, qty: item.qty, options: item.options || {} })) };
    const result = await backendRequest('/rest/v1/rpc/place_order', {
      method: 'POST', body: JSON.stringify({ p_request: request })
    }, true);
    if (!result?.id) throw new Error('O pedido não retornou um número. Consulte sua conta antes de tentar novamente.');
    db.cart = [];
    localStore.setItem(cartStorageKey, '[]');
    sessionStore.setItem('forte-customer', currentEmail());
    try {
      await loadCatalog();
      if (isOwner) await loadAdminState(); else await loadMyOrders();
    } catch (syncError) {
      await boot();
    }
    go('/loja/pedido/' + result.id);
    toast(`Pedido #${result.id} recebido. Acompanhe os próximos passos na sua conta.`);
  } catch (error) { toast(`Não foi possível enviar o pedido: ${error.message}`); }
  finally { submit.disabled = false; }
};

createAdminOrder = form => {
  if (!canSell()) return;
  const f = Object.fromEntries(new FormData(form));
  const product = db.products.find(p => p.id === Number(f.product));
  const qty = Number(f.qty);

  const addressParts = f.delivery === 'Retirada' ? (db.settings.addressParts || parseAddress(db.settings.address)) : addressFromForm(f);
  const order = { ...f, addressParts, address: f.delivery === 'Retirada' ? db.settings.address : formatAddress(addressParts),
    id: Math.max(1000, ...db.orders.map(o => o.id)) + 1, date: new Date().toLocaleDateString('en-CA'), freight: Number(f.freight),
    items: [{ id: product.id, name: product.name, price: salePrice(product), cost: product.cost, qty }],
    status: 'pending', paid: false, receipt: null, channel: 'Loja física', seller: role === 'Vendedor' ? currentSeller : f.seller };
  db.orders.unshift(order);
  if (save()) { closeModal(); go('/app/orders/' + order.id); toast('Pré-venda criada. Produtos reservados.'); }
};
